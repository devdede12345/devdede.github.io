site_name: blog of devdede
site_description: 记录学习、实践与思考的个人博客与知识库
site_url: !ENV [SITE_URL, 'http://127.0.0.1:8000/']
use_directory_urls: true
theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  icon:
    logo: material/notebook-outline
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
plugins:
  - search:
      lang: [zh, en]
  - blog:
      blog_dir: blog
      post_url_format: '{date}/{slug}'
      archive_date_format: yyyy 年
      archive_name: 文章归档
      categories_name: 文章分类
      pagination_per_page: 6
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
extra_javascript:
  - javascripts/comments.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
nav:
