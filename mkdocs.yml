      - 欢迎: index.md
      - 阅读指南: guide.md
  - 文章:
      - blog/index.md
  - 知识库:
      - notes/index.md
      - 开发工具:
          - Git 常用操作: notes/git.md
          - Markdown 写作: notes/markdown.md
  - CS300:
      - 课程概览: cs300/index.md
